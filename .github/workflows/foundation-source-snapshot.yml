name: Foundation full source snapshot (non-Stable)

# Explicit one-shot branch trigger. Never publishes npm or promotes Studio.
on:
  push:
    branches:
      - source-release/0.21.0-20261020

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: foundation-full-source-0.21.0-20261020
  cancel-in-progress: false

jobs:
  source-archive:
    name: Verify exact main and publish immutable source prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm one-file trigger on current fully green main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          SOURCE_SHA="$(git rev-parse HEAD^)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$SOURCE_SHA" != "$MAIN_SHA" ]; then
            echo "Source release trigger must be based on current main HEAD" >&2
            exit 1
          fi
          if [ "$(git diff-tree --no-commit-id --name-only -r HEAD)" != "source-release-trigger.txt" ]; then
            echo "Release trigger must change only source-release-trigger.txt" >&2
            exit 1
          fi
          VERSION="$(git show "$SOURCE_SHA:package.json" | node -e "let s='';process.stdin.on('data',b=>s+=b).on('end',()=>console.log(JSON.parse(s).version))")"
          test "$VERSION" = "0.21.0"
          TAG="foundation-source-v0.21.0-20261020"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable source Release already exists; never overwrite" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Immutable source tag already exists; never move it" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/source-checks.json"
          node --input-type=module - "$RUNNER_TEMP/source-checks.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const checks = JSON.parse(readFileSync(process.argv[2], 'utf8')).check_runs ?? [];
          const required = [
            'Static gates (no install)',
            'Node 22 compatibility',
            'Node 24 release gates',
            'Windows Node 24 · Complete offline verification',
            'P5 synthetic idempotency · ubuntu-latest',
            'P5 synthetic idempotency · windows-latest',
            'codeql', 'build', 'deploy'
          ];
          for (const name of required) {
            if (!checks.some(check => check.name === name && check.status === 'completed' && check.conclusion === 'success')) {
              throw Error('Source snapshot denied: exact-main missing successful check ' + name);
            }
          }
          console.log('All required checks passed on exact source main commit');
          NODE
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Git-archive exact main and verify ZIP, tar.gz and SHA256
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/source-release
          SHORT_SHA="${SOURCE_SHA:0:12}"
          NAME="frontend-foundation-0.21.0-source-$SHORT_SHA"
          PREFIX="$NAME/"
          git archive --format=zip --prefix="$PREFIX" "$SOURCE_SHA" > "dist/source-release/$NAME.zip"
          git archive --format=tar --prefix="$PREFIX" "$SOURCE_SHA" | gzip -n > "dist/source-release/$NAME.tar.gz"
          unzip -t "dist/source-release/$NAME.zip" > /dev/null
          tar -tzf "dist/source-release/$NAME.tar.gz" > /dev/null
          test "$(unzip -Z -1 "dist/source-release/$NAME.zip" | grep -Fxc "$PREFIX"'package.json')" -eq 1
          test "$(tar -tzf "dist/source-release/$NAME.tar.gz" | grep -Fxc "$PREFIX"'pnpm-lock.yaml')" -eq 1
          LOCK_SHA="$(git show "$SOURCE_SHA:pnpm-lock.yaml" | sha256sum | awk '{print $1}')"
          cat > dist/source-release/SOURCE-METADATA.txt <<EOF
          Repository: $GITHUB_REPOSITORY
          Full source commit: $SOURCE_SHA
          Source-only prerelease tag: $SOURCE_TAG
          Root version: 0.21.0
          pnpm-lock.yaml SHA256: $LOCK_SHA
          Generated by git archive from tracked files; no working-tree extras.
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Not an npm latest dist-tag or a Studio Stable release.
          EOF
          (
            cd dist/source-release
            sha256sum "$NAME.zip" "$NAME.tar.gz" SOURCE-METADATA.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          cp docs/releases/0.21.0-source-snapshot-20261020.md dist/source-release/RELEASE_NOTES.md
          {
            printf '\n## Exact source provenance\n\n'
            printf -- '- Source commit: %s\n' "$SOURCE_SHA"
            printf -- '- Git tag: %s\n' "$SOURCE_TAG"
            printf -- '- pnpm lockfile SHA-256: %s\n' "$LOCK_SHA"
            printf -- '- Verify attached assets with sha256sum -c SHA256SUMS.\n'
          } >> dist/source-release/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: full-source-snapshot-${{ steps.source.outputs.sha }}
          path: dist/source-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish source-only prerelease with immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to mutate existing Release" >&2
            exit 1
          fi
          gh release create "$SOURCE_TAG" \
            dist/source-release/*.zip \
            dist/source-release/*.tar.gz \
            dist/source-release/SHA256SUMS \
            dist/source-release/SOURCE-METADATA.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Frontend Foundation 0.21.0 — full source snapshot (prerelease)' \
            --notes-file dist/source-release/RELEASE_NOTES.md \
            --prerelease
          gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,targetCommitish,assets,url \
            --jq '{tag: .tagName, isDraft, isPrerelease, targetCommitish, url, assets: [.assets[].name]}'

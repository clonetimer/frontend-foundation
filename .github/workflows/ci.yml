name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static gates (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull-request checkout points to a test merge commit. Its first
          # parent is the base used to verify the bot's *actual* lockfile diff.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tooling/scripts/architecture-check.mjs
      - run: node tooling/scripts/repository-check.mjs
      - name: Verify pnpm catalog is in sync and Dependabot changes real resolutions
        run: node tooling/scripts/dependabot-catalog-gate.mjs
      - name: Unit-test dependency update gate (no installation required)
        run: node --test tooling/scripts/test-dependabot-catalog-gate.mjs
      - run: node tooling/scripts/capability-check.mjs
      - run: node tooling/oss/verify.mjs
      - run: node tooling/deployment/verify.mjs
      - run: node --test tooling/scripts/test-chromium-cdp-start.mjs

  node22-compat:
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:offline
      - run: pnpm typecheck
      - run: pnpm test

  release-gates:
    name: Node 24 release gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release:api
      - name: Install Nginx for runtime delivery smoke
        run: sudo apt-get update && sudo apt-get install -y nginx
      - run: pnpm deploy:smoke
      - run: pnpm storybook:build
      - run: pnpm consumer:test
      - run: pnpm release:preflight
      - run: pnpm release:plan
      - run: pnpm pack:foundation
      - name: Ensure validation did not mutate tracked files
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-release-artifacts-${{ github.sha }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14


  windows-deployment-offline:
    name: Windows Node 24 · Complete offline verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact workspace dependencies for release-tooling offline regressions
        run: pnpm install --frozen-lockfile
      - name: Full offline verification from Windows PowerShell
        shell: pwsh
        run: node tooling/scripts/offline-verify.mjs
      - name: Explicit portable/entrypoint deployment regression
        shell: pwsh
        run: node --test tooling/deployment/tests/deployment.test.mjs

  p5-synthetic-idempotency:
    name: P5 synthetic idempotency · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: P5-R2b fail-closed browser journal and explicit recovery contract
        run: node --test tooling/scripts/aas_p0/test_p5_client_recovery.mjs
      - name: P5-R3a authenticated write capability negotiation (read-only contract)
        run: node --test tooling/scripts/aas_p0/test_p5_capability_contract.mjs
      - name: P5-R3c scoped pending journal, fail-closed Web Locks and explicit original-key recovery
        run: node --test tooling/scripts/aas_p0/test_p5_r3c_scoped_journal.mjs
      - name: P5-R3c2a portable opt-in trusted-host boundary and ZIP source parity
        run: node --test tooling/scripts/aas_p0/test_p5_r3c2_runtime_adapter.mjs tooling/scripts/test-p5-r3c2-export-parity.mjs
      - name: P5-R3b1 scoped identity, token rotation, native SQLite ledger and tombstone GC
        run: python -m unittest discover -s tooling/scripts/aas_p0 -p 'test_p5_r3b_scoped_reference.py' -v
      - name: P5-R3b2 same-origin session, CSRF and scoped ledger contract
        run: python -m unittest discover -s tooling/scripts/aas_p0 -p 'test_p5_r3b_session_adapter.py' -v
      - name: Execute isolated SQLite replay and ETag/CAS contract
        run: python -m unittest discover -s tooling/scripts/aas_p0 -p 'test_*idempotency.py' -v
      - name: Check native AAS P0 gateway backwards compatibility
        run: python -m unittest discover -s tooling/scripts/aas_p0 -p test_secure_records.py -v

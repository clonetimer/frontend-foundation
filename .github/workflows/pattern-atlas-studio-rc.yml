name: Pattern Atlas Studio RC Artifact
on:
  pull_request:
    paths:
      - 'apps/showcase/**'
      - 'packages/**'
      - 'tooling/scripts/pattern-atlas-studio-rc-*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pattern-atlas-studio-rc.yml'
  push:
    branches: [main]
    paths:
      - 'apps/showcase/**'
      - 'packages/**'
      - 'tooling/scripts/pattern-atlas-studio-rc-*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pattern-atlas-studio-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-candidate:
    name: ${{ matrix.os }} · Studio editor package + production Chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.23.2
          - os: windows-latest
            node: 24.12.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Find isolated Windows/Linux Chrome binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
            test -f "$CHROME" || { echo 'Chrome missing on Windows runner' >&2; exit 1; }
          else
            CHROME=$(command -v google-chrome || command -v chromium || true)
            test -n "$CHROME" || { echo 'No Chrome/Chromium on runner' >&2; exit 1; }
          fi
          echo "CHROMIUM_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Install Chinese font coverage for Linux visual evidence
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @foundation/showcase build
      - name: Package Studio editor candidate
        run: node tooling/scripts/pattern-atlas-studio-rc-package.mjs
        env:
          STUDIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Smoke installed production editor in Chromium
        run: node tooling/scripts/pattern-atlas-studio-rc-smoke.mjs
      - name: Preserve candidate package and P0 browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pattern-atlas-studio-rc-editor-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/pattern-atlas/studio-rc/
            artifacts/pattern-atlas/studio-p0-evidence/
          if-no-files-found: warn
          retention-days: 30

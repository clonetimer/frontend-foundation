name: Pattern Atlas Standalone Export
on:
  pull_request:
    paths:
      - 'apps/showcase/src/modules/pattern-atlas/**'
      - 'tooling/scripts/pattern-atlas-export-build-smoke.mjs'
      - 'tooling/scripts/pattern-atlas-export-browser-check.mjs'
      - '.github/workflows/pattern-atlas-standalone-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-build:
    name: Independent React ZIP build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify Chrome availability
        run: google-chrome --version
      - name: Build and browser-test real standalone export
        run: node tooling/scripts/pattern-atlas-export-build-smoke.mjs --browser
        env:
          CHROMIUM_BIN: google-chrome
      - name: Upload exported browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pattern-atlas-export-browser-${{ github.sha }}
          path: artifacts/pattern-atlas-export-browser.png
          if-no-files-found: ignore

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    versioning-strategy: increase-if-necessary
    ignore:
      # Node 26 types are beyond the currently advertised Node 22/24 support range.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      frontend-foundation-runtime:
        patterns:
          - react
          - react-dom
          - react-router
          - antd
          - '@tanstack/*'
      frontend-foundation-tooling:
        patterns:
          - typescript
          - vite
          - vitest
          - eslint
          - 'typescript-eslint'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: UTC

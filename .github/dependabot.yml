version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    # Request an explicit newer lower bound, rather than retaining a catalog
    # range while pnpm v11 updater emits an importer-order-only no-op.
    # This is a mitigation, NOT evidence that upstream pnpm catalog bugs are fixed.
    # CI independently requires actual old -> new lockfile package resolutions.
    versioning-strategy: increase
    # Our supported runtimes are Node 22/24; @types/node 26 is out of scope.
    # Allow compatible Node 22 type fixes, but block major-line upgrades.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      frontend-foundation-runtime:
        patterns:
          - react
          - react-dom
          - react-router
          - antd
          - '@tanstack/*'
      frontend-foundation-tooling:
        patterns:
          - typescript
          - vite
          - vitest
          - eslint
          - 'typescript-eslint'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: UTC
